<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Karthick's engineering constellation</title>
  <desc id="desc">An abstract network of connected backend technologies and engineering concepts, with a luminous central systems node.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1020"/>
      <stop offset=".52" stop-color="#111b2b"/>
      <stop offset="1" stop-color="#101525"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9b7bff"/>
      <stop offset=".52" stop-color="#5ef0cf"/>
      <stop offset="1" stop-color="#c6ff6b"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#5ef0cf" stop-opacity=".3"/>
      <stop offset="1" stop-color="#5ef0cf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="82" height="62" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r="1" fill="#dce8ff" opacity=".34"/>
      <circle cx="53" cy="42" r=".8" fill="#dce8ff" opacity=".2"/>
      <circle cx="72" cy="8" r=".7" fill="#dce8ff" opacity=".25"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#background)" stroke="#d9e3f7" stroke-opacity=".13"/>
  <rect x="2" y="2" width="1196" height="296" rx="21" fill="url(#stars)"/>
  <path d="M25 228C190 228 198 88 365 88S552 228 600 150 817 72 916 150s150 78 259 78" fill="none" stroke="#71839e" stroke-opacity=".2"/>
  <path d="M25 78C177 78 217 217 362 217s171-140 238-67 175 96 283 6 194-78 292-78" fill="none" stroke="#71839e" stroke-opacity=".17"/>
  <path d="M72 150H274L350 88H488M712 150H831L902 78H960M362 217H483L556 150M644 150L719 217H842" fill="none" stroke="url(#beam)" stroke-opacity=".58" stroke-width="1.5"/>
  <circle cx="600" cy="150" r="88" fill="url(#core)"/>
  <circle cx="600" cy="150" r="49" fill="#121e2c" stroke="url(#beam)" stroke-width="1.5"/>
  <circle cx="600" cy="150" r="38" fill="none" stroke="#dce8ff" stroke-opacity=".15" stroke-dasharray="2 6"/>
  <text x="600" y="146" text-anchor="middle" fill="#eff8ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">SYSTEMS</text>
  <text x="600" y="167" text-anchor="middle" fill="#9db0c7" font-family="monospace" font-size="10" letter-spacing="2">IN MOTION</text>
  <circle cx="600" cy="150" r="5" fill="#c6ff6b" filter="url(#glow)"/>
  <g fill="#c6ff6b">
    <circle cx="274" cy="150" r="3"/><circle cx="350" cy="88" r="3"/>
    <circle cx="488" cy="88" r="3"/><circle cx="712" cy="150" r="3"/>
    <circle cx="831" cy="150" r="3"/><circle cx="902" cy="78" r="3"/>
    <circle cx="362" cy="217" r="3"/><circle cx="483" cy="217" r="3"/>
    <circle cx="719" cy="217" r="3"/><circle cx="842" cy="217" r="3"/>
  </g>
  <g font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.2">
    <rect x="40" y="133" width="132" height="34" rx="17" fill="#182538" stroke="#9b7bff" stroke-opacity=".65"/>
    <text x="106" y="155" text-anchor="middle" fill="#d9ccff">JAVA</text>
    <rect x="228" y="53" width="156" height="34" rx="17" fill="#182538" stroke="#5ef0cf" stroke-opacity=".65"/>
    <text x="306" y="75" text-anchor="middle" fill="#b9fff0">SPRING BOOT</text>
    <rect x="410" y="53" width="116" height="34" rx="17" fill="#182538" stroke="#c6ff6b" stroke-opacity=".6"/>
    <text x="468" y="75" text-anchor="middle" fill="#e1ffb5">REST APIs</text>
    <rect x="960" y="133" width="150" height="34" rx="17" fill="#182538" stroke="#c6ff6b" stroke-opacity=".6"/>
    <text x="1035" y="155" text-anchor="middle" fill="#e1ffb5">DISTRIBUTED</text>
    <rect x="807" y="53" width="118" height="34" rx="17" fill="#182538" stroke="#9b7bff" stroke-opacity=".65"/>
    <text x="866" y="75" text-anchor="middle" fill="#d9ccff">DOCKER</text>
    <rect x="284" y="217" width="124" height="34" rx="17" fill="#182538" stroke="#9b7bff" stroke-opacity=".65"/>
    <text x="346" y="239" text-anchor="middle" fill="#d9ccff">MYSQL</text>
    <rect x="430" y="217" width="118" height="34" rx="17" fill="#182538" stroke="#5ef0cf" stroke-opacity=".65"/>
    <text x="489" y="239" text-anchor="middle" fill="#b9fff0">REDIS</text>
    <rect x="691" y="217" width="116" height="34" rx="17" fill="#182538" stroke="#5ef0cf" stroke-opacity=".65"/>
    <text x="749" y="239" text-anchor="middle" fill="#b9fff0">AWS</text>
    <rect x="825" y="217" width="158" height="34" rx="17" fill="#182538" stroke="#c6ff6b" stroke-opacity=".6"/>
    <text x="904" y="239" text-anchor="middle" fill="#e1ffb5">ASYNC JOBS</text>
  </g>
  <text x="38" y="35" fill="#91a2bc" font-family="monospace" font-size="10" letter-spacing="2">ENGINEERING CONSTELLATION</text>
  <text x="1090" y="35" text-anchor="end" fill="#91a2bc" font-family="monospace" font-size="10" letter-spacing="2">SYSTEMS IN MOTION</text>
  <text x="600" y="280" text-anchor="middle" fill="#91a2bc" font-family="monospace" font-size="10" letter-spacing="2">FROM CLEAN APIs TO CONNECTED SYSTEMS</text>
</svg>
